    <style>
      /* Container for the progress bar */
      #loading-bar-container1 {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background: transparent;
        z-index: 9999;
      }

      /* The animated progress bar */
      #loading-bar1 {
        height: 100%;
        width: 0%;
        opacity: 1;
        background: black;
        animation: load 2s infinite;
      }

      @keyframes load {
        0% {
          width: 0%;
          opacity: 1;
        }
        99% {
          width: 100%;
          opacity: 0;
        }
        100% {
          width: 0%;
          opacity: 0;
        }
      }

      /* Fade out effect for the container when ready */
      .fade-out {
        animation: fadeOut 0.5s forwards;
      }

      @keyframes fadeOut {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
    </style>
